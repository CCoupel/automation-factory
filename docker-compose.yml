# Automation Factory — Docker Compose
#
# Usage:
#   Local dev:  docker compose up --build
#   CI/staging: IMAGE_TAG=2.3.6-rc.1 ENVIRONMENT=STAGING docker compose up --build
#
# Environment variables (all have defaults for local dev):
#   IMAGE_TAG    — image tag suffix (default: dev)
#   ENVIRONMENT  — DEV, STAGING or PROD (default: DEV)

services:
  redis:
    image: redis:7-alpine
    container_name: automation-factory-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    image: automation-factory-backend:${IMAGE_TAG:-dev}
    container_name: automation-factory-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_TYPE=sqlite
      - SQLITE_DB_PATH=/tmp/automation_factory_dev.db
      - DEBUG=${DEBUG:-true}
      - ENVIRONMENT=${ENVIRONMENT:-DEV}
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    image: automation-factory-frontend:${IMAGE_TAG:-dev}
    container_name: automation-factory-frontend
    environment:
      - BASE_PATH=
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: automation-factory-nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    command: |
      sh -c '
        echo "# Nginx configuration" > /etc/nginx/conf.d/default.conf
        echo "upstream frontend_upstream { server automation-factory-frontend:80; }" >> /etc/nginx/conf.d/default.conf
        echo "upstream backend_upstream { server automation-factory-backend:8000; }" >> /etc/nginx/conf.d/default.conf
        echo "server {" >> /etc/nginx/conf.d/default.conf
        echo "  listen 80;" >> /etc/nginx/conf.d/default.conf
        echo "  server_name localhost;" >> /etc/nginx/conf.d/default.conf
        echo "  location = /health { access_log off; add_header Content-Type application/json; return 200 \"{\\\"status\\\":\\\"healthy\\\",\\\"service\\\":\\\"nginx-proxy\\\"}\"; }" >> /etc/nginx/conf.d/default.conf
        echo "  location /api { proxy_pass http://backend_upstream; proxy_set_header Host \$$host; proxy_set_header X-Real-IP \$$remote_addr; proxy_set_header X-Forwarded-For \$$proxy_add_x_forwarded_for; }" >> /etc/nginx/conf.d/default.conf
        echo "  location /ws/ { proxy_pass http://backend_upstream; proxy_http_version 1.1; proxy_set_header Upgrade \$$http_upgrade; proxy_set_header Connection \"upgrade\"; proxy_set_header Host \$$host; proxy_read_timeout 86400; }" >> /etc/nginx/conf.d/default.conf
        echo "  location / { proxy_pass http://frontend_upstream; proxy_set_header Host \$$host; proxy_set_header X-Real-IP \$$remote_addr; }" >> /etc/nginx/conf.d/default.conf
        echo "}" >> /etc/nginx/conf.d/default.conf
        nginx -g "daemon off;"
      '
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
