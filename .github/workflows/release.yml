name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      skip_images:
        description: 'Skip Docker images build (chart only)'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  GITHUB_USERNAME: ccoupel  # Must be lowercase for GHCR

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate tag format
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Release uniquement depuis un tag vX.Y.Z (ref courante : ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}'). Relancer le workflow en selectionnant le tag, pas une branche."
            exit 1
          fi
          TAG_NAME="${GITHUB_REF_NAME}"
          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag invalide : ${TAG_NAME} (attendu vX.Y.Z)"
            exit 1
          fi

      - name: Check version consistency
        id: check
        run: |
          python3 scripts/version.py check --tag "${GITHUB_REF_NAME}"
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "✅ Version validée : ${VERSION}"

  tests:
    name: Tests (gate avant publication)
    needs: [validate]
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  build-backend:
    name: Build and Push Backend Docker Image
    runs-on: ubuntu-latest
    needs: [validate, tests]
    if: ${{ !inputs.skip_images }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GITHUB_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/automation-factory-backend:${{ needs.validate.outputs.version }}
            ${{ github.event_name == 'push' && github.ref_type == 'tag' && format('{0}/{1}/automation-factory-backend:latest', env.REGISTRY, env.GITHUB_USERNAME) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image published
        run: |
          echo "✅ Backend image published!"
          echo "📍 ${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/automation-factory-backend:${{ needs.validate.outputs.version }}"

  build-frontend:
    name: Build and Push Frontend Docker Image
    runs-on: ubuntu-latest
    needs: [validate, tests]
    if: ${{ !inputs.skip_images }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GITHUB_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/automation-factory-frontend:${{ needs.validate.outputs.version }}
            ${{ github.event_name == 'push' && github.ref_type == 'tag' && format('{0}/{1}/automation-factory-frontend:latest', env.REGISTRY, env.GITHUB_USERNAME) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image published
        run: |
          echo "✅ Frontend image published!"
          echo "📍 ${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/automation-factory-frontend:${{ needs.validate.outputs.version }}"

  publish-helm-chart:
    name: Package and Push Helm Chart to GHCR
    runs-on: ubuntu-latest
    needs: [validate, tests, build-backend, build-frontend]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      needs.tests.result == 'success' &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: '3.13.0'

      - name: Add Helm repositories
        run: |
          echo "📦 Adding Helm repositories..."
          helm repo add pascaliske https://charts.pascaliske.dev
          helm repo update
          echo "📦 Searching available charts..."
          helm search repo pascaliske

      - name: Update Helm dependencies
        run: |
          cd helm/automation-factory
          echo "📦 Creating charts directory..."
          mkdir -p charts
          echo "📦 Updating Helm dependencies..."
          helm dependency update
          echo "📦 Checking downloaded dependencies..."
          ls -lha charts/ || echo "charts/ directory not found"
          cat Chart.lock || echo "Chart.lock not found"

      - name: Package Helm chart
        run: |
          cd helm/automation-factory
          echo "📦 Packaging Helm chart..."
          helm package . --destination charts/
          ls -lh charts/

      - name: Log in to GitHub Container Registry
        run: |
          echo "🔐 Logging in to GitHub Container Registry..."
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ env.GITHUB_USERNAME }} --password-stdin

      - name: Push Helm chart to GHCR
        run: |
          cd helm/automation-factory
          CHART_VERSION="${{ needs.validate.outputs.version }}"
          echo "🚀 Pushing chart to ${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}..."
          helm push "charts/automation-factory-${CHART_VERSION}.tgz" "oci://${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}"
          echo "✅ Chart published successfully!"

      - name: Summary
        run: |
          CHART_VERSION="${{ needs.validate.outputs.version }}"
          echo "📦 PUBLISHED ARTIFACTS:"
          echo "  - Helm Chart     oci://${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/automation-factory:${CHART_VERSION}"
          echo "  - Backend Image  ${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/automation-factory-backend:${CHART_VERSION}"
          echo "  - Frontend Image ${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/automation-factory-frontend:${CHART_VERSION}"
          echo ""
          echo "Install with:"
          echo "  helm install automation-factory oci://${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/automation-factory \\"
          echo "    --version ${CHART_VERSION} \\"
          echo "    --namespace automation-factory \\"
          echo "    --create-namespace"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, publish-helm-chart]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION="${{ needs.validate.outputs.version }}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📌 Creating release for ${TAG_NAME}"

      - name: Generate changelog
        id: changelog
        run: |
          CHART_VERSION="${{ needs.validate.outputs.version }}"

          # Get previous tag
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -A1 -F "${{ steps.version.outputs.tag_name }}" | tail -1)

          # Generate changelog
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log ${PREV_TAG}..${{ steps.version.outputs.tag_name }} --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log ${{ steps.version.outputs.tag_name }} --pretty=format:"- %s (%h)" --no-merges | head -20)
          fi

          # Create release notes
          cat > release_notes.md << EOF
          ## 🚀 Automation Factory ${{ steps.version.outputs.version }}

          ### 📦 Published Artifacts

          - **Helm Chart**: \`oci://${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/automation-factory:${CHART_VERSION}\`
          - **Backend Image**: \`${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/automation-factory-backend:${CHART_VERSION}\`
          - **Frontend Image**: \`${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/automation-factory-frontend:${CHART_VERSION}\`

          ### 📥 Installation

          \`\`\`bash
          # Install with Helm
          helm install automation-factory oci://${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/automation-factory \\
            --version ${CHART_VERSION} \\
            --namespace automation-factory \\
            --create-namespace
          \`\`\`

          ### 📝 Changes

          ${CHANGELOG}

          ---

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ steps.version.outputs.tag_name }}
          EOF

          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Release ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release created
        run: |
          echo "✅ GitHub Release created!"
          echo "🔗 https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag_name }}"
