# .github/workflows/ci-branch.yml
# Pre-validation sans publication (infra.md §3bis C10). Ne lance QUE scripts/ci.sh (CI_CMD, C11).
# Son verdict sur le SHA exact de milestone/vX.Y.Z conditionne la BARRIERE de PUBLISH PROD
# (publish.prod.template.md, etape 1quater) et la fermeture des issues DONE (GITHUB.md §8.2).
name: CI Branch

on:
  push:
    branches:
      - 'milestone/*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (scripts/ci.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Chaine d'outils aux versions du projet (identiques a test.yml)
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run CI_CMD
        run: bash scripts/ci.sh

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: |
            backend/coverage.xml
            frontend/coverage/
          if-no-files-found: ignore
